<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Flat illustration of a researcher at a mass spectrometer">
  <!-- background -->
  <rect width="600" height="600" fill="#15776B"/>
  <circle cx="300" cy="300" r="250" fill="#1C8C7C"/>
  <rect y="468" width="600" height="132" fill="#106357"/>

  <!-- floating molecule (back wall) -->
  <g opacity="0.55">
    <g stroke="#7FD1C1" stroke-width="5" stroke-linecap="round" fill="none">
      <polygon points="120,92 150,109 150,143 120,160 90,143 90,109"/>
      <line x1="120" y1="92" x2="120" y2="66"/>
      <line x1="150" y1="109" x2="174" y2="95"/>
    </g>
    <g fill="#7FD1C1">
      <circle cx="120" cy="92" r="7"/><circle cx="150" cy="109" r="7"/><circle cx="150" cy="143" r="7"/>
      <circle cx="120" cy="160" r="7"/><circle cx="90" cy="143" r="7"/><circle cx="90" cy="109" r="7"/>
    </g>
    <circle cx="120" cy="66" r="8" fill="#F2B441"/>
    <circle cx="174" cy="95" r="8" fill="#F2B441"/>
  </g>

  <!-- monitor -->
  <rect x="432" y="236" width="14" height="30" fill="#B9C9C4"/>
  <rect x="336" y="110" width="206" height="130" rx="10" fill="#22383C"/>
  <rect x="348" y="122" width="182" height="106" rx="4" fill="#0F2A2E"/>
  <g stroke="#CFEDE6" stroke-width="5" stroke-linecap="round">
    <line x1="366" y1="212" x2="366" y2="196"/>
    <line x1="382" y1="212" x2="382" y2="172"/>
    <line x1="398" y1="212" x2="398" y2="202"/>
    <line x1="414" y1="212" x2="414" y2="182"/>
    <line x1="446" y1="212" x2="446" y2="192"/>
    <line x1="462" y1="212" x2="462" y2="166"/>
    <line x1="478" y1="212" x2="478" y2="198"/>
    <line x1="494" y1="212" x2="494" y2="186"/>
    <line x1="510" y1="212" x2="510" y2="204"/>
  </g>
  <line x1="430" y1="212" x2="430" y2="140" stroke="#F2B441" stroke-width="6" stroke-linecap="round"/>
  <line x1="358" y1="214" x2="520" y2="214" stroke="#CFEDE6" stroke-width="3" stroke-linecap="round"/>

  <!-- bench -->
  <rect x="200" y="452" width="420" height="16" rx="4" fill="#EAD9B5"/>
  <rect x="200" y="468" width="420" height="10" fill="#C9B48A"/>

  <!-- mass spectrometer -->
  <rect x="300" y="262" width="236" height="190" rx="14" fill="#F4F7F6"/>
  <rect x="508" y="262" width="28" height="190" rx="10" fill="#D8E3E0"/>
  <g stroke="#D8E3E0" stroke-width="4" stroke-linecap="round">
    <line x1="330" y1="276" x2="380" y2="276"/>
    <line x1="330" y1="284" x2="380" y2="284"/>
  </g>
  <rect x="318" y="296" width="172" height="36" rx="7" fill="#22383C"/>
  <circle cx="336" cy="314" r="6" fill="#6FDC8C"/>
  <circle cx="356" cy="314" r="6" fill="#6FDC8C"/>
  <circle cx="376" cy="314" r="6" fill="#F2B441"/>
  <rect x="398" y="309" width="76" height="10" rx="5" fill="#3F5A5E"/>
  <rect x="318" y="344" width="172" height="94" rx="9" fill="#E7EEEC"/>
  <rect x="332" y="358" width="70" height="8" rx="4" fill="#CBD8D4"/>
  <rect x="332" y="374" width="46" height="8" rx="4" fill="#CBD8D4"/>
  <!-- ion source -->
  <rect x="270" y="336" width="40" height="76" rx="7" fill="#CBD8D4"/>
  <circle cx="290" cy="362" r="10" fill="#F2B441"/>
  <circle cx="290" cy="362" r="4" fill="#FFF3D6"/>

  <!-- ions flying into the inlet -->
  <g fill="#F2B441">
    <circle cx="306" cy="350" r="3"/><circle cx="314" cy="356" r="2.5"/><circle cx="312" cy="345" r="2"/>
  </g>

  <!-- researcher (back three-quarter view, facing the instrument) -->
  <!-- far-side sleeve, hanging -->
  <path d="M104 318 C 86 380, 80 470, 84 560 L 116 560 C 112 470, 116 390, 128 330 Z" fill="#D3DFDB"/>
  <!-- coat -->
  <path d="M84 600 C 88 470, 96 340, 124 304 C 142 284, 162 276, 180 274 C 204 276, 226 284, 244 302 C 262 334, 268 470, 270 600 Z" fill="#F7FAF9"/>
  <path d="M84 600 C 88 470, 96 340, 124 304 C 132 296, 140 290, 150 285 C 126 340, 118 470, 120 600 Z" fill="#E4ECEA"/>
  <!-- back seam, half-belt, vent -->
  <path d="M182 290 C 184 380, 184 470, 182 600" stroke="#DCE6E3" stroke-width="3" fill="none"/>
  <rect x="140" y="452" width="86" height="14" rx="4" fill="#E4ECEA"/>
  <circle cx="148" cy="459" r="3.2" fill="#C5D3CF"/><circle cx="218" cy="459" r="3.2" fill="#C5D3CF"/>
  <!-- reaching arm -->
  <path d="M226 296 C 256 320, 286 328, 312 318" stroke="#EEF4F2" stroke-width="36" stroke-linecap="round" fill="none"/>
  <path d="M232 318 C 258 334, 284 338, 306 332" stroke="#DCE6E3" stroke-width="5" stroke-linecap="round" fill="none"/>
  <rect x="306" y="300" width="14" height="34" rx="5" fill="#E4ECEA" transform="rotate(-14 313 317)"/>
  <path d="M320 304 C 332 300, 342 304, 344 312 C 346 320, 338 328, 326 328 C 320 326, 318 318, 320 304 Z" fill="#E3AD8A"/>
  <!-- collar -->
  <path d="M140 286 C 156 268, 204 266, 222 286 C 206 279, 158 279, 140 286 Z" fill="#DCE6E3"/>
  <!-- neck -->
  <path d="M164 244 L 200 244 L 202 278 C 190 284, 174 284, 162 278 Z" fill="#DDA27F"/>
  <!-- head: a sliver of cheek and the ear show; mostly hair from behind -->
  <circle cx="184" cy="212" r="40" fill="#E8B996"/>
  <path d="M146 248 C 128 228, 128 192, 146 174 C 164 158, 198 158, 214 172 C 224 182, 228 194, 224 204 C 218 201, 211 201, 206 205 C 202 212, 206 222, 202 232 C 200 240, 198 244, 196 246 C 182 254, 160 254, 146 248 Z" fill="#2E2A33"/>
  <path d="M152 178 C 168 168, 194 168, 210 180" stroke="#4A4552" stroke-width="4" stroke-linecap="round" fill="none"/>
  <ellipse cx="212" cy="222" rx="7" ry="10" fill="#DDA27F"/>
</svg>
