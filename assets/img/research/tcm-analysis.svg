<svg viewBox="0 0 640 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Medicinal materials such as ginseng, agarwood, citrus peel and Senecio are analysed into a chromatogram; a toxic peak is flagged and quality is certified">
  <rect width="640" height="420" rx="24" fill="#EEF3FB"/>
  <circle cx="320" cy="210" r="150" fill="#DDE7F6"/>

  <!-- herb tray -->
  <rect x="28" y="64" width="232" height="292" rx="18" fill="#FFFFFF"/>

  <!-- ginseng root -->
  <g transform="translate(70 92)">
    <path d="M30 0 C 18 6, 22 22, 26 30" stroke="#5E8C3A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M26 30 C 14 40, 10 66, 20 86 C 24 94, 22 108, 16 122 M20 86 C 30 98, 40 104, 52 112 M24 58 C 36 60, 46 66, 54 78" stroke="#D8B47C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M30 28 C 44 30, 46 56, 38 76 C 32 92, 18 92, 16 74 C 14 56, 18 32, 30 28 Z" fill="#E9CB96"/>
    <path d="M24 44 L 36 46 M22 58 L 34 60" stroke="#C9A36A" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 0 C 40 -10, 56 -8, 60 2 C 50 4, 40 4, 30 0 Z" fill="#6FA84A"/>
  </g>

  <!-- agarwood chip -->
  <g transform="translate(150 98)">
    <path d="M0 16 L 70 0 L 82 34 L 12 58 Z" fill="#7A4E2D"/>
    <path d="M10 26 C 30 20, 50 16, 74 10 M8 40 C 32 32, 52 28, 78 22" stroke="#3E2615" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M14 50 C 36 42, 56 38, 80 30" stroke="#A9764A" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- dried citrus peel -->
  <g transform="translate(148 196)">
    <path d="M6 40 C 0 14, 26 -2, 52 6 C 78 14, 86 40, 70 58 C 56 50, 44 44, 30 46 C 20 48, 12 46, 6 40 Z" fill="#D9792B"/>
    <path d="M14 38 C 18 22, 34 14, 50 18 C 64 22, 70 34, 66 46 C 56 40, 42 36, 30 38 Z" fill="#F0A85A"/>
    <g fill="#B85F1C"><circle cx="20" cy="26" r="2"/><circle cx="36" cy="14" r="2"/><circle cx="58" cy="16" r="2"/><circle cx="72" cy="32" r="2"/></g>
  </g>

  <!-- Senecio flowers (toxic, contain pyrrolizidine alkaloids) -->
  <g transform="translate(76 248)">
    <path d="M30 80 C 30 60, 28 40, 32 20 M30 60 C 18 52, 8 50, 0 52 M30 46 C 42 40, 52 40, 60 44" stroke="#5E8C3A" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g fill="#F2B441">
      <circle cx="32" cy="14" r="5"/><circle cx="41" cy="18" r="5"/><circle cx="41" cy="9" r="5"/><circle cx="23" cy="18" r="5"/><circle cx="23" cy="9" r="5"/><circle cx="32" cy="4" r="5"/>
    </g>
    <circle cx="32" cy="12" r="5" fill="#C98A12"/>
    <g fill="#F2B441"><circle cx="0" cy="48" r="4"/><circle cx="7" cy="46" r="4"/><circle cx="62" cy="40" r="4"/><circle cx="56" cy="38" r="4"/></g>
  </g>

  <!-- arrow to analysis -->
  <path d="M272 210 L 312 210" stroke="#7CA6D8" stroke-width="5" stroke-linecap="round"/>
  <path d="M308 200 L 320 210 L 308 220" stroke="#7CA6D8" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- sample vial -->
  <rect x="334" y="150" width="40" height="18" rx="4" fill="#2E52A3"/>
  <rect x="338" y="168" width="32" height="96" rx="8" fill="#FFFFFF" stroke="#A9C7E6" stroke-width="3"/>
  <rect x="341" y="208" width="26" height="53" rx="6" fill="#E9B65E" opacity="0.85"/>

  <!-- chromatogram card -->
  <rect x="396" y="92" width="216" height="200" rx="16" fill="#FFFFFF"/>
  <path d="M414 262 L 430 262 C 438 262, 440 200, 446 200 C 452 200, 454 262, 462 262 L 474 262 C 480 262, 484 160, 492 160 C 500 160, 504 262, 510 262 L 524 262 C 530 262, 534 226, 540 226 C 546 226, 548 262, 556 262 L 566 262 C 572 262, 576 134, 582 134 C 588 134, 592 262, 598 262"
        stroke="#1D3470" stroke-width="3.5" fill="none" stroke-linejoin="round"/>
  <path d="M566 262 C 572 262, 576 134, 582 134 C 588 134, 592 262, 598 262 Z" fill="#E8743B" opacity="0.35"/>
  <path d="M474 262 C 480 262, 484 160, 492 160 C 500 160, 504 262, 510 262 Z" fill="#7CA6D8" opacity="0.35"/>
  <line x1="410" y1="264" x2="600" y2="264" stroke="#A9C7E6" stroke-width="3" stroke-linecap="round"/>
  <!-- toxic constituent flagged -->
  <path d="M582 100 L 598 126 L 566 126 Z" fill="#E8743B"/>
  <rect x="580.5" y="108" width="3" height="10" rx="1.5" fill="#FFFFFF"/>
  <circle cx="582" cy="121" r="1.8" fill="#FFFFFF"/>

  <!-- quality certified: shield badge -->
  <path d="M486 312 L 520 300 L 554 312 L 554 338 C 554 360, 538 374, 520 380 C 502 374, 486 360, 486 338 Z" fill="#2E52A3"/>
  <path d="M506 340 L 516 350 L 536 328" stroke="#F2B441" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
