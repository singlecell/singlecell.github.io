<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract flat profile portrait of a young researcher">
  <!-- background -->
  <rect width="600" height="600" fill="#15776B"/>
  <circle cx="300" cy="300" r="250" fill="#1C8C7C"/>
  <!-- abstract sun disc behind the head -->
  <circle cx="300" cy="262" r="150" fill="#F2B441" opacity="0.9"/>

  <!-- molecule and spectrum in front of the face -->
  <g stroke="#EAF7F3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <polygon points="486,150 516,167 516,201 486,218 456,201 456,167"/>
    <line x1="486" y1="150" x2="486" y2="122"/>
    <line x1="456" y1="201" x2="432" y2="215"/>
  </g>
  <g fill="#EAF7F3">
    <circle cx="486" cy="150" r="7"/><circle cx="516" cy="167" r="7"/><circle cx="516" cy="201" r="7"/>
    <circle cx="486" cy="218" r="7"/><circle cx="456" cy="201" r="7"/><circle cx="456" cy="167" r="7"/>
  </g>
  <circle cx="486" cy="122" r="8" fill="#F2B441"/>
  <circle cx="432" cy="215" r="8" fill="#F2B441"/>
  <g stroke="#7FD1C1" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="470" y1="420" x2="470" y2="392"/>
    <line x1="488" y1="420" x2="488" y2="352"/>
    <line x1="506" y1="420" x2="506" y2="404"/>
    <line x1="542" y1="420" x2="542" y2="380"/>
    <line x1="460" y1="422" x2="556" y2="422" stroke-width="3"/>
  </g>
  <line x1="524" y1="420" x2="524" y2="318" stroke="#F2B441" stroke-width="6" stroke-linecap="round"/>

  <!-- shoulders: lab coat as flat blocks -->
  <path d="M120 640 L 150 500 C 168 456, 220 436, 282 432 L 356 432 C 414 436, 456 462, 474 500 L 500 640 Z" fill="#F4F7F6"/>
  <path d="M120 640 L 150 500 C 168 456, 220 436, 282 432 L 262 640 Z" fill="#DCE6E3"/>
  <path d="M290 432 L 352 432 L 336 500 Z" fill="#CFE2EF"/>
  <path d="M282 432 L 318 470 L 300 540 L 266 452 Z" fill="#E6EEEC"/>
  <path d="M352 432 L 330 478 L 352 540 L 380 448 Z" fill="#FFFFFF"/>

  <!-- neck -->
  <path d="M266 360 L 340 404 L 344 448 C 322 462, 290 460, 268 446 Z" fill="#D99A75"/>

  <!-- head in profile, facing right: two flat skin planes -->
  <path d="M266 360 C 236 336, 224 288, 232 240 C 244 172, 298 140, 350 148 C 394 156, 416 194, 414 236 L 420 262 C 422 270, 417 276, 419 282 C 430 300, 442 314, 446 326 C 448 333, 440 337, 431 337 C 433 344, 433 350, 429 354 C 435 358, 433 365, 427 367 C 429 376, 424 386, 416 391 C 404 400, 388 402, 372 402 C 358 402, 348 406, 340 418 Z" fill="#F0C29F"/>
  <path d="M266 360 C 240 338, 228 300, 232 262 L 330 300 L 384 400 C 368 402, 352 406, 340 418 Z" fill="#E2A985"/>
  <path d="M330 300 L 372 330 L 384 400 Z" fill="#D99A75" opacity="0.7"/>

  <!-- ear: abstract half disc -->
  <path d="M300 262 A 26 30 0 1 0 300 322 Z" fill="#D99A75"/>
  <path d="M294 276 A 12 16 0 1 0 294 308" stroke="#C9845F" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- hair: one bold geometric shape with a forward sweep -->
  <path d="M226 290 C 214 214, 252 146, 326 138 C 382 132, 420 162, 424 214 C 408 198, 384 194, 362 202 C 340 210, 322 220, 310 236 C 300 246, 286 250, 272 254 C 264 280, 260 308, 254 334 C 240 328, 229 312, 226 290 Z" fill="#23212A"/>
  <path d="M300 150 C 340 140, 390 152, 414 186 C 384 174, 344 172, 312 184 Z" fill="#3B3744"/>

  <!-- brow, eye, glasses -->
  <path d="M378 244 L 410 240" stroke="#23212A" stroke-width="7" stroke-linecap="round"/>
  <path d="M392 266 L 408 264" stroke="#23212A" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="398" cy="266" r="22" fill="#FFFFFF" fill-opacity="0.12" stroke="#23212A" stroke-width="4"/>
  <path d="M376 264 L 306 270" stroke="#23212A" stroke-width="4" stroke-linecap="round"/>
  <!-- mouth: a single calm line -->
  <path d="M412 362 L 426 361" stroke="#A8574F" stroke-width="4" stroke-linecap="round"/>
</svg>
