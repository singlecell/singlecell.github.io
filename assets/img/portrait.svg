<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract three-quarter self-portrait of a young researcher">
  <!-- background -->
  <rect width="600" height="600" fill="#15776B"/>
  <circle cx="300" cy="300" r="250" fill="#1C8C7C"/>
  <circle cx="300" cy="258" r="152" fill="#F2B441" opacity="0.9"/>

  <!-- molecule and spectrum -->
  <g stroke="#EAF7F3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9">
    <polygon points="488,140 518,157 518,191 488,208 458,191 458,157"/>
    <line x1="488" y1="140" x2="488" y2="112"/>
    <line x1="458" y1="191" x2="434" y2="205"/>
  </g>
  <g fill="#EAF7F3">
    <circle cx="488" cy="140" r="7"/><circle cx="518" cy="157" r="7"/><circle cx="518" cy="191" r="7"/>
    <circle cx="488" cy="208" r="7"/><circle cx="458" cy="191" r="7"/><circle cx="458" cy="157" r="7"/>
  </g>
  <circle cx="488" cy="112" r="8" fill="#F2B441"/>
  <circle cx="434" cy="205" r="8" fill="#F2B441"/>
  <g stroke="#7FD1C1" stroke-width="6" stroke-linecap="round" opacity="0.8">
    <line x1="472" y1="420" x2="472" y2="392"/>
    <line x1="490" y1="420" x2="490" y2="352"/>
    <line x1="508" y1="420" x2="508" y2="404"/>
    <line x1="544" y1="420" x2="544" y2="380"/>
    <line x1="462" y1="422" x2="558" y2="422" stroke-width="3"/>
  </g>
  <line x1="526" y1="420" x2="526" y2="318" stroke="#F2B441" stroke-width="6" stroke-linecap="round"/>

  <!-- body turned three-quarter: near (left) shoulder broad, far shoulder narrow -->
  <path d="M90 640 L 112 520 C 132 468, 196 442, 262 436 L 344 430 C 396 432, 436 454, 456 494 L 482 640 Z" fill="#F4F7F6"/>
  <path d="M90 640 L 112 520 C 132 468, 196 442, 262 436 L 286 640 Z" fill="#DCE6E3"/>
  <path d="M300 432 L 352 430 L 334 498 Z" fill="#CFE2EF"/>
  <path d="M292 432 L 326 470 L 312 548 L 276 456 Z" fill="#E6EEEC"/>
  <path d="M352 430 L 336 474 L 352 540 L 376 446 Z" fill="#FFFFFF"/>

  <!-- neck -->
  <path d="M270 352 L 334 352 L 346 446 C 324 460, 292 458, 270 444 Z" fill="#D99A75"/>
  <path d="M270 352 L 300 360 L 296 452 C 286 450, 277 448, 270 444 Z" fill="#CC8B67"/>

  <!-- ear (near side) -->
  <path d="M236 256 A 24 30 0 1 0 236 316 Z" fill="#D99A75"/>
  <path d="M232 270 A 11 16 0 1 0 232 302" stroke="#C9845F" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- head, three-quarter view facing right -->
  <path d="M232 230 C 228 274, 232 316, 250 346 C 266 370, 292 386, 318 386 C 340 384, 356 368, 360 344 C 362 330, 364 320, 362 312 C 366 306, 366 300, 362 296 L 368 286 C 366 276, 360 266, 356 258 C 362 246, 364 230, 360 214 C 350 172, 316 152, 290 152 C 256 152, 234 184, 232 230 Z" fill="#F0C29F"/>
  <!-- shadow plane: far side and under the cheekbone -->
  <path d="M328 236 L 356 258 C 360 266, 366 276, 368 286 L 362 296 C 366 300, 366 306, 362 312 C 364 320, 362 330, 360 344 C 356 368, 340 384, 318 386 L 330 340 L 334 300 Z" fill="#E2A985"/>
  <path d="M250 346 C 266 370, 292 386, 318 386 L 300 360 L 262 330 Z" fill="#E7B391"/>
  <!-- nose: bridge and tip break the far contour -->
  <path d="M326 262 C 338 280, 356 302, 370 318 C 374 324, 368 330, 358 330 L 330 328 Z" fill="#F0C29F"/>
  <path d="M326 262 C 334 286, 340 308, 344 328 L 330 328 Z" fill="#E2A985"/>
  <path d="M326 262 C 338 280, 356 302, 370 318" stroke="#C9845F" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M336 330 C 344 334, 354 334, 362 330" stroke="#C9845F" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- hair -->
  <path d="M226 262 C 214 196, 244 140, 300 134 C 352 128, 380 164, 372 222 C 364 204, 352 192, 336 186 C 312 196, 278 196, 256 184 C 246 204, 240 230, 238 258 C 234 262, 230 264, 226 262 Z" fill="#23212A"/>
  <path d="M256 184 C 280 196, 314 198, 336 186 C 322 168, 298 156, 264 152 C 284 162, 296 172, 304 184 C 286 186, 268 186, 256 184 Z" fill="#2E2B36"/>
  <path d="M262 146 C 292 134, 338 138, 362 166" stroke="#4A4656" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- brows -->
  <path d="M256 238 C 268 230, 288 230, 302 236" stroke="#23212A" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M322 236 C 332 230, 344 230, 352 236" stroke="#23212A" stroke-width="6" stroke-linecap="round" fill="none"/>
  <!-- eyes: gaze turned back toward the viewer -->
  <path d="M264 266 C 270 258, 290 258, 296 266 C 290 271, 270 271, 264 266 Z" fill="#FFFFFF"/>
  <path d="M326 265 C 330 259, 344 259, 348 265 C 344 269, 330 269, 326 265 Z" fill="#FFFFFF"/>
  <circle cx="273" cy="265" r="6" fill="#2A2228"/>
  <circle cx="331" cy="264.5" r="5" fill="#2A2228"/>
  <path d="M263 266 C 270 257, 290 257, 297 265" stroke="#3A2E30" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M325 265 C 330 258, 344 258, 349 265" stroke="#3A2E30" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- glasses: near lens round, far lens foreshortened -->
  <g stroke="#23212A" stroke-width="4" fill="#FFFFFF" fill-opacity="0.12">
    <circle cx="280" cy="266" r="23"/>
    <ellipse cx="338" cy="265" rx="15" ry="22"/>
  </g>
  <path d="M303 263 C 312 258, 318 258, 323 262" stroke="#23212A" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M257 262 L 238 260" stroke="#23212A" stroke-width="4" stroke-linecap="round"/>
  <path d="M266 254 L 274 248" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- mouth -->
  <path d="M302 352 C 312 356, 324 356, 334 350" stroke="#A8574F" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
