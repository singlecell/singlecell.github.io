- name: AgarwoodMiniMS
  image: ai/agarwood-minims.png
  image_fit: contain
  image_credit:
    url: https://doi.org/10.1007/s41664-024-00331-0
    label: { en: "Figure 1 — Xie et al. (2025)", zh: "图 1 — Xie 等（2025）" }
  released: 2026-10
  tagline:
    en: Mass-spectrum classification for rapid on-site agarwood authentication
    zh: 面向沉香现场快速鉴别的质谱分类工具
  description:
    en: >
      Companion software to a paper capillary spray miniature mass spectrometry workflow
      for rapid, on-site agarwood authentication. It trains models on prepared spectral
      tables and predicts authentic agarwood, Kynam, and counterfeit classes using random
      forest, SVM, KNN, naive Bayes, or gradient boosting. Includes a Windows application,
      source code, and DEMO data for training and prediction.
    zh: >
      配套纸毛细管喷雾微型质谱研究，用于沉香现场快速鉴别中的质谱数据分析。
      可基于整理后的质谱数据训练模型，预测沉香、奇楠与伪品类别，支持随机森林、
      SVM、KNN、朴素贝叶斯和梯度提升。提供 Windows 程序、源代码及训练和预测 DEMO 数据。
  tags:
    en: [Machine learning, Mass spectrometry, Agarwood, On-site authentication]
    zh: [机器学习, 质谱分析, 沉香, 现场快速鉴别]
  links:
    - kind: github
      url: https://github.com/singlecell/AgarwoodMiniMS
      label: { en: GitHub, zh: GitHub }
    - kind: download
      url: https://github.com/singlecell/AgarwoodMiniMS/releases/latest
      label: { en: Download, zh: 下载 }
    - kind: paper
      url: https://doi.org/10.1007/s41664-024-00331-0
      label: { en: Paper, zh: 论文 }

- name: TLC-RAPID
  image: ai/tlc-rapid.jpg # under assets/img/
  released: 2026-09
  tagline:
    en: Automated TLC spot detection and quantification from plate images
    zh: 基于图像的薄层色谱斑点自动识别与定量分析
  description:
    en: >
      A deep-learning tool that locates thin-layer chromatography (TLC) spots in digital
      plate images with a YOLOv5 instance-segmentation model, then back-calculates sample
      amounts from same-plate standard calibration. It handles visible-light, 254 nm, and
      366 nm fluorescence plates, lets users add missed spots by hand, and exports
      traceable Excel reports. Ships as a one-click Windows application.
    zh: >
      一款深度学习工具：利用 YOLOv5 实例分割模型自动定位 TLC 板数字图像中的斑点，
      再根据同板标准品校正曲线反算样品含量。支持可见光、254 nm 与 366 nm 荧光成像，
      可手动补标漏检斑点，并导出可追溯的 Excel 结果报告。提供一键运行的 Windows 应用程序。
  metrics:
    - value: "99.2%"
      label: { en: Precision, zh: 精确率 }
    - value: "95.4%"
      label: { en: Recall, zh: 召回率 }
    - value: "97.3%"
      label: { en: F1-score, zh: F1 值 }
  metrics_note:
    en: Independent test set of 82 images / 745 bands
    zh: 独立测试集：82 张图像、745 个条带
  tags:
    en: [Deep learning, Computer vision, Instance segmentation, TLC, Quantitative analysis]
    zh: [深度学习, 计算机视觉, 实例分割, 薄层色谱, 定量分析]
  links:
    - kind: github
      url: https://github.com/zongxuli709-code/TLC-RAPID
      label: { en: GitHub, zh: GitHub }
    - kind: download
      url: https://github.com/zongxuli709-code/TLC-RAPID/releases/tag/v1.0
      label: { en: Download v1.0, zh: 下载 v1.0 }
