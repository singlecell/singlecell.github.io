# Research directions shown on /research/ and /zh/research/ (and summarised on the home pages).
# Each text field has an English (en) and Chinese (zh) version.

intro:
  en: >
    I develop new mass-spectrometry technologies and instrumentation for analysing complex
    traditional Chinese medicine (TCM) systems. By integrating in situ mass spectrometry,
    miniature mass spectrometry and artificial intelligence, my group has built a systematic
    in situ MS platform for TCM. The work runs along three mutually reinforcing directions:
    <strong>AI-driven intelligent analysis</strong> turns spectra and images into decisions,
    <strong>in situ mass spectrometry</strong> changes how and where we measure, and
    <strong>quality and safety evaluation of TCM</strong> applies both to medicinal materials
    and preparations.
  zh: >
    长期从事中药复杂体系质谱分析新技术及装备应用研究，围绕“原位质谱—微型质谱—人工智能”融合，
    系统构建了中药原位质谱分析技术体系。研究分为三个相互支撑的方向：<strong>AI驱动智能分析</strong>实现数据的智能解析与判别，
    <strong>原位质谱研究</strong>革新测量的方式与场景，<strong>中药质量与安全评价</strong>落实到药材与制剂的品质评价与安全性筛查。

papers_label: { en: Representative papers, zh: 代表性论文 }
