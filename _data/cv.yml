  summary: >
    Associate Professor at the Institute of Chinese Materia Medica, Shanghai
    University of Traditional Chinese Medicine. My research develops mass
    spectrometry, chromatography, and sample-pretreatment technologies for the
    discovery and precise characterization of active ingredients in natural
    medicines, endogenous molecular targeting and metabolomics, green chemistry
    strategies, and the quality control and safety evaluation of natural products.

