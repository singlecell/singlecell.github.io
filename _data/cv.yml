    Research Interests:
      - label: AI-driven analysis
        details: "Machine learning fused with in situ and miniature mass-spectrometry data for intelligent interpretation and discrimination; deep learning for image-based quantitation"
      - label: In situ mass spectrometry
        details: "TLC–ambient MS, chromatography–bioautography–MS screening, mass spectrometry imaging, and miniature MS for on-site testing without sample preparation"
      - label: TCM analysis
        details: "Characterization, quality evaluation and safety screening of medicinal materials and preparations; ISO 19842:2025 international standard"

    Academic Service:
      - label: Editorial boards
        details: "Associate Editor, Future Journal of Pharmaceutical Sciences; Young Editorial Board Member of Journal of Analytical Testing, Biomedical Analysis, Phytochemical Analysis, Chinese Herbal Medicine, and Acta Materia Medica; Guest Editor, Frontiers in Chemistry"
      - label: Committees & standards
        details: "Expert, Working Group 1, ISO/TC 249 (Traditional Chinese Medicine), ISO; Member, Medical Mass Spectrometry Committee, China Association for Instrumental Analysis (CAIA); Young Committee Member, Pharmaceutical Analysis Professional Committee, Shanghai Pharmaceutical Association"
      - label: Reviewing
        details: "Peer reviewer for more than 20 SCI journals, including Advanced Science and Analytical Chemistry"
