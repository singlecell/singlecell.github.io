# Teaching content shown on /teaching/ and /zh/teaching/.
# Media files live in assets/teaching/ (kept out of assets/img/ so the
# responsive-image plugin does not convert them).
# Each text field has an English (en) and Chinese (zh) version.
# Empty lists show a "coming soon" note on the page.

# ---------------------------------------------------------------------------
# Courses (optional). Copy the commented example and fill it in.
# ---------------------------------------------------------------------------
courses:
  - name: { en: Analytical Chemistry, zh: 分析化学 }
    audience: { en: Undergraduate, zh: 本科生 }
    description:
      en: >
        An undergraduate course in analytical chemistry. The spectroscopy and
        chromatography animations below are its companion learning materials.
      zh: >
        面向本科生的分析化学课程。下方的光谱分析与色谱分析动图为本课程的配套学习资料。
#  - name: { en: Analytical Chemistry, zh: 分析化学 }
#    audience: { en: Undergraduate, zh: 本科生 }
#    term: { en: Fall, zh: 秋季学期 }
#    description:
#      en: One or two sentences about the course.
#      zh: 一两句话的课程简介。
#    links:                       # optional
#      - url: https://example.com/syllabus.pdf
#        label: { en: Syllabus, zh: 教学大纲 }

# ---------------------------------------------------------------------------
# Learning materials, shown grouped by category in the order listed here.
#   media:    path under assets/. .mp4 / .webm play as silent looping videos
#             (only while on screen); .gif / .png / .jpg / .svg show as images.
#   poster:   optional still image shown before a video loads.
#   download: optional file offered as a download (e.g. the MP4 itself).
#   category: one filter button and one heading per category; use the same
#             en/zh wording for every item in it.
#   lang:     optional (en or zh). The item then appears only on the page in
#             that language; use it for media with labels in one language.
#             Without it the item appears on both pages.
#   description, link: optional, as in courses.
#
# The animations are 1892 x 1010 MP4s rendered from the Python sources in
# _animations/ (see its README). To add one from a GIF instead, run:
#   ffmpeg -i in.gif -movflags +faststart -pix_fmt yuv420p \
#     -vf "scale=trunc(iw/2)*2:trunc(ih/2)*2" -c:v libx264 -crf 24 -an out.mp4
#   ffmpeg -ss 7 -i in.gif -frames:v 1 -q:v 4 out.jpg
# ---------------------------------------------------------------------------
